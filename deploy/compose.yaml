services:
  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["node", "src/scripts/migrate.js"]
    environment: &backend_environment
      NODE_ENV: production
      DB_HOST: ${DB_HOST:?Set DB_HOST to the managed PostgreSQL host}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_SSL: "true"
      DB_SSL_CA_PATH: /run/secrets/postgres_ca
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL to a private Redis endpoint}
      JWT_SECRET: ${JWT_SECRET:?Set a long random JWT_SECRET}
      FRONTEND_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the HTTPS application URL}
    secrets:
      - postgres_ca
    restart: "no"

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      <<: *backend_environment
      PORT: "5000"
      RUN_MIGRATIONS_ON_START: "false"
      TLS_TERMINATED_AT_PROXY: "true"
      TRUST_PROXY: "2"
    secrets:
      - postgres_ca
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped

  gateway:
    image: nginx:1.27.4-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

secrets:
  postgres_ca:
    file: ${DB_SSL_CA_FILE:?Set DB_SSL_CA_FILE to the PostgreSQL CA certificate file}
